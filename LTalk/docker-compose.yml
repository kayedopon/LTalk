version: "3.9"

services:
  db:
    image: postgres:16
    env_file: .env      # keeps POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]

  web:
    build: .
    command: gunicorn LTalk.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    volumes:
      - static_volume:/static         # STATIC_ROOT
      # - media_volume:/media           # MEDIA_ROOT (optional)
    depends_on: [db]
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - static_volume:/static:ro
      # - media_volume:/media:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web]
    networks: [backend]

volumes:
  db_data:
  static_volume:

networks:
  backend:
