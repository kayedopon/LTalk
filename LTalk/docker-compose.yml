version: "3.9"

services:
  db:
    image: postgres:16
    env_file: .env      # keeps POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [backend]

  web:
    build: .
    # Add to your docker-compose.yml file under the web service:
    command: bash -c "python manage.py collectstatic --no-input && python manage.py migrate && gunicorn LTalk.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file: .env
    volumes:
      - static_volume:/static         # STATIC_ROOT
      - media_volume:/media           # MEDIA_ROOT
      - logs_volume:/var/log
    depends_on: [db]
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 1G  # Increase memory limit

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/static:ro
      - media_volume:/media:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro   # Mount certs
    depends_on: [web]
    networks: [backend]

  backup:
    image: postgres:16
    env_file: .env
    volumes:
      - ./backups:/backups
    networks: [backend]
    depends_on: [db]
    entrypoint: |
      bash -c 'bash -s <<EOF
      apt-get update && apt-get install -y cron
      echo "0 0 * * * pg_dump -h db -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/backup_\$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz" > /etc/cron.d/backup-cron
      chmod 0644 /etc/cron.d/backup-cron
      crontab /etc/cron.d/backup-cron
      cron -f
      EOF'

volumes:
  db_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  backend:
