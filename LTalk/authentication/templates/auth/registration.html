{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="title-block"><p>{{ title }}</p></div>
        <div class="form-block">
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                    <li class="message">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
            <div class="social-login-block">
                {% load socialaccount %}
                <a href="{% provider_login_url 'google' process='signin' %}" class="google-login-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px; flex-shrink: 0;">
                        <path d="M17.64 9.20455C17.64 8.56818 17.5818 7.95455 17.4659 7.36364H9V10.8409H13.8436C13.6364 11.9545 13.0091 12.9091 12.0455 13.5455V15.8182H14.9591C16.6773 14.25 17.64 11.9318 17.64 9.20455Z" fill="#4285F4"/>
                        <path d="M9 18C11.4318 18 13.5364 17.2091 14.9591 15.8182L12.0455 13.5455C11.2182 14.0818 10.2045 14.4091 9 14.4091C6.95909 14.4091 5.21818 13.0091 4.54091 11.1591H1.51818V13.5C2.90455 16.1318 5.72727 18 9 18Z" fill="#34A853"/>
                        <path d="M4.54091 11.1591C4.35455 10.6227 4.25 10.0455 4.25 9.45455C4.25 8.86364 4.35455 8.28636 4.54091 7.75L1.51818 5.4C0.545455 7.10909 0 9.20455 0 11.25C0 13.2955 0.545455 15.3909 1.51818 17.1L4.54091 14.75C4.74545 13.5864 4.54091 12.3773 4.54091 11.1591Z" fill="#FBBC05"/>
                        <path d="M9 3.59091C10.3182 3.59091 11.5091 4.03636 12.4545 4.93182L15.0227 2.36364C13.5364 0.890909 11.4318 0 9 0C5.72727 0 2.90455 1.86818 1.51818 4.5L4.54091 6.84091C5.21818 4.99091 6.95909 3.59091 9 3.59091Z" fill="#EA4335"/>
                    </svg>
                    <span>Sign Up with Google</span>
                </a>
            </div>
            <p>Or sign up with:</p>
            <form action="" method="POST">
                {% csrf_token %}
                
                <div class="input-box">
                    <label class="input-label" for="id_username">Username</label>
                    <input class="input-field" type="text" name="username" maxlength="30" required id="id_username" placeholder="yourusername">
                </div>
                
                <div class="input-box">
                    <label class="input-label" for="id_email">Email</label>
                    <input class="input-field" type="email" name="email" maxlength="50" required id="id_email" placeholder="youremail@gmail.com">
                </div>

                <div class="input-box">
                    <label class="input-label" for="language-select">Your first language</label>
                    <select class="input-field" name="language" id="language-select" required>
                        <option value="" disabled selected>Select a language</option>
                        {% for code, name in lang_choices %}
                            <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="input-box">
                    <label class="input-label" for="id_password1">Password</label>
                    <input class="input-field" type="password" name="password1" autocomplete="new-password" required id="id_password1" placeholder="Enter password">
                </div>
                
                <div class="input-box">
                    <label class="input-label" for="id_password2">Confirm Password</label>
                    <input class="input-field" type="password" name="password2" autocomplete="new-password" required id="id_password2" placeholder="Repeat password">
                </div>
                
                <div class="input-box" id="login-button">
                    <button type="submit">Sign up</button>
                </div>
            </form>
        </div>
        <div class="link-block">
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>
</body>
</html>
