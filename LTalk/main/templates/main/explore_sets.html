{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explore Word Sets</title>
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
    <script src="{% static 'main/js/check_theme.js' %}"></script>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="home-container">
        <a href="{% url 'home' %}" class="btn btn-primary upload-button">← Back to My Sets</a>
        <h1 class="home-title">Explore Public Word Sets</h1>
        <input type="text" id="search-input" class="search-input" placeholder="Search word sets by title...">
        
        <div class="wordsets-wrapper">
            <ul id="wordsets-list" class="wordsets-list"></ul>
            <div id="loading" class="loading" style="display: none;">Loading...</div>
            <p class="no-wordsets" style="display: none;">No public word sets found.</p>
        </div>
    </div>
    <script src="{% static 'main/js/explore_sets.js' %}"></script>
    <script src="{% static 'main/js/theme.js' %}"></script>
    <script src="{% static 'main/js/touch.js' %}"></script>
</body>
</html>
