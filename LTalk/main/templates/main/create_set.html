<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTalk - Image Word Extractor</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
    <script src="{% static 'main/js/check_theme.js' %}"></script>
    <style>
        /* minimal extras for the file list */
        .file-list      { margin: .5rem 0 0; padding-left: 1.2rem; list-style: disc; }
        .file-list li   { margin-bottom: .25rem; display: flex; gap: .5rem; align-items: center; }
        .remove-file-btn{
            font: inherit; background: none; border: none;
            cursor: pointer; line-height: 1; padding: 0 .25rem;
        }
        .remove-file-btn:hover { color: red; }
        /* keep it on one line, align centre, and tighten the gap */
        .privacy-toggle{
            display:inline-flex;     /* inline keeps it next to the inputs above */
            align-items:center;
            gap:0.4rem;              /* space between box and text */
            margin:0.5rem 0;         /* top/bottom breathing-room */
            white-space:nowrap;      /* never wrap the text */
        }

        .word-edit-row{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap:.5rem;
            margin-bottom:.5rem;
        }
        .word-edit-row input{ width:100%; }
        .remove-btn {
            background: red;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }

    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h1>LTalk Image Word Extractor</h1>

        <div class="upload-section">
            <form id="form1" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- hidden <input> so we can style the label as a button -->
                <input  type="file"
                        id="image-input"
                        name="image"           
                        accept="image/*"
                        multiple            
                        class="hidden-input">

                <label for="image-input" class="upload-button">Choose image(s)</label>

                <!-- tiny summary: “3 file(s) selected” -->
                <span id="file-name"></span>

                <!-- full list under the button -->
                <ul id="file-list" class="file-list"></ul>

                <button type="submit" class="upload-button" style="margin-top:10px;">
                    Process image(s)
                </button>
            </form>
        </div>

        <div id="result">
            <form action="" id="word-form" method="post">
                {% csrf_token %}
                <input type="hidden" name="words_json" id="words-json">
                <input type="text"   name="wordset_title" id="wordset-title"
                    class="wordset-input" placeholder="Enter word set title" required>
                <input type="text"   name="wordset_description" id="wordset-description"
                    class="wordset-input" placeholder="Short description (optional)">
                <label class="privacy-toggle">
                    <input type="checkbox" id="wordset-public">
                    <span>Make&nbsp;public</span>
                </label>
                <div class="words-container" id="words-container"></div>
                <button type="button" class="new-word" id="new-word">Add new word</button>
            </form>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
        </div>
    <script src="{% static 'main/js/word_extractor.js' %}" defer></script>
    <script src="{% static 'main/js/theme.js' %}"></script>
    <script src="{% static 'main/js/touch.js' %}"></script>
</body>
</html>
