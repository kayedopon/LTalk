<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Word Set</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/styles.css' %}">
    <script src="{% static 'main/js/check_theme.js' %}"></script>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h1>New Word Set</h1>

        <div class="upload-section">
            <form id="form1" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- hidden <input> so we can style the label as a button -->
                <input  type="file"
                        id="image-input"
                        name="image"           
                        accept="image/*"
                        multiple            
                        class="hidden-input">

                <label for="image-input" class="upload-button">Choose image(s)</label>

                <!-- tiny summary: “3 file(s) selected” -->
                <span id="file-name"></span>

                <!-- full list under the button -->
                <ul id="file-list" class="file-list"></ul>

                <button type="submit" class="upload-button" style="margin-top:10px;">
                    Process image(s)
                </button>
            </form>
        </div>

        <div id="result">
            <form action="" id="word-form" method="post">
                {% csrf_token %}
                <input type="hidden" name="words_json" id="words-json">
                <input type="text"   name="wordset_title" id="wordset-title"
                    class="wordset-input" placeholder="Enter word set title" required>
                <input type="text"   name="wordset_description" id="wordset-description"
                    class="wordset-input" placeholder="Short description (optional)">
                <label class="privacy-toggle">
                    <input type="checkbox" id="wordset-public">
                    <span>Make&nbsp;public</span>
                </label>
                <div class="words-container" id="words-container"></div>
                <button type="button" class="new-word" id="new-word">Add new word</button>
            </form>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
        </div>
    <script src="{% static 'main/js/word_extractor.js' %}" defer></script>
    <script src="{% static 'main/js/theme.js' %}"></script>
    <script src="{% static 'main/js/touch.js' %}"></script>
</body>
</html>
